name: 00 · Hola workflows

# Este workflow solo se ejecuta cuando tú lo pides desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "¿Cómo te llamas?"
        required: true
        default: "ciclista"

# Permisos mínimos, declarados de forma explícita.
# En una organización, el valor por omisión del token lo decide la empresa:
# declararlo aquí hace que este workflow funcione igual en cualquier repositorio.
permissions:
  contents: read

jobs:
  saludar:
    name: Saludar y mostrar el contexto
    runs-on: ubuntu-latest

    steps:
      - name: Saludar a la persona
        run: echo "¡Hola, ${{ inputs.nombre }}! Bienvenido a GitHub Actions."

      - name: Mostrar quién y qué disparó el workflow
        run: |
          echo "Repositorio  : ${{ github.repository }}"
          echo "Organización : ${{ github.repository_owner }}"
          echo "Rama         : ${{ github.ref_name }}"
          echo "Evento       : ${{ github.event_name }}"
          echo "Ejecutado por: ${{ github.actor }}"

      - name: Mostrar la máquina donde corre
        run: |
          echo "Sistema operativo: $RUNNER_OS"
          echo "Directorio de trabajo: $PWD"
          uname -a